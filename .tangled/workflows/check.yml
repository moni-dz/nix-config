when:
  - event: ["push", "manual", "pull_request"]
    branch: ["master"]

engine: nixery

steps:
  - name: "nix flake check"
    command: "nix --extra-experimental-features 'nix-command flakes' flake check --show-trace"
  - name: "format"
    command: "nix --extra-experimental-features 'nix-command flakes' fmt -- --ci"
